<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transfer Center</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx"
      crossorigin="anonymous"
    />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/x-icon" href="/images/montefavicon.png" />
    <!-- CSS only -->
  </head>

  <body>
    <div class="animated-bg"></div>
    <div class="content-wrapper">
      <nav class="header navbar navbar-light">
<div class="logo-wrapper">
  <img id="monteLogo" src="images/1280px-Montefiore_logo.svg.png" alt="Montefiore Logo" />
  <!-- <img class="santa-hat" src="images/santahat.png" alt="Santa Hat" /> -->
</div>
        <h2 class="tc-title">Command Center</h2>
      </nav>

      <div class="main-content">
        <form>
          <!-- FIGURE OUT HOW TO OPEN LINK ON SAME PAGE FOR QGENDA AND EXTERNAL EXTENSIONS -->
          <div class="button-row">
            <!-- <button id="openQgendaBtn" class="btn btn-lg btn-primary btn-main">
              QGenda
            </button> -->

            <button
              type="button"
              onclick="window.open('internal.html')"
              class="btn btn-lg btn-success btn-main glass-btn">
              <span class="btn-text">Montefiore Extensions</span>
            </button>

            <button 
              type="button"
              onclick="window.open('oncall.html')"
              id="openOncallBtn" 
              class="btn btn-lg btn-primary btn-main glass-btn">
              <span class="btn-text">On Call Schedules</span>
            </button>

            <button
            type="button" 
            onclick="window.open('external.html')"
            id="openExternalBtn" 
            class="btn btn-lg btn-warning btn-main glass-btn holiday-snowcap">
            <span class="btn-text">External Hospitals</span>
            </button>
          </div>
          <div class="button-row">
            <button
              onclick="window.open('https://manager.everbridge.net/saml/login/MonteManagerPortal')"
              class="btn btn-lg btn-danger btn-main glass-btn"
            >
              <span class="btn-text">STEMI</span>
            </button>
            <button
              onclick="window.open('https://montefiore.strokepages.com/')"
              class="btn btn-lg btn-danger btn-main glass-btn"
            >
              <span class="btn-text">STROKE</span>
            </button>
            <!-- ADD URL TO HOW TO FIND SERVICES PAGE -->
            <button 
            type="button"
            onclick="window.open('faq.html')"
            id="openFaqBtn" 
            class="btn btn-lg btn-info btn-main glass-btn">
              <span class="btn-text">Information</span>
            </button>
          </div>
<footer class="modern-footer">
  <ul>
    <li>
      <span class="footer-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path fill="currentColor" d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02z" />
        </svg>
      </span>
      <div class="footer-contact">
        <span class="footer-label">Transfer Center</span>
        <span class="footer-value">718-920-2800</span>
      </div>
    </li>
    <li>
      <span class="footer-icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" focusable="false">
          <path fill="currentColor" d="M3 7h14a2 2 0 0 1 2 2v3h5a2 2 0 0 1 1.7 1l4.3 7v5a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z" />
          <path fill="#173858" d="M21 14h3l3.5 6H21zM9 10h3v3h3v3h-3v3H9v-3H6v-3h3z" />
          <g fill="currentColor" stroke="#173858" stroke-width="1.5">
            <circle cx="8" cy="26" r="4" />
            <circle cx="25" cy="26" r="4" />
          </g>
          <g fill="#173858">
            <circle cx="8" cy="26" r="1.8" />
            <circle cx="25" cy="26" r="1.8" />
          </g>
        </svg>
      </span>
      <div class="footer-contact">
        <span class="footer-label">Empress Ambulance</span>
        <span class="footer-value">914-965-5040</span>
      </div>
    </li>
    <li>
      <span class="footer-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path fill="currentColor" d="M18 3H6v4h2V5h8v2h2V3Zm1 5H5a3 3 0 0 0-3 3v6h4v4h12v-4h4v-6a3 3 0 0 0-3-3ZM16 19H8v-6h8v6Zm3-7a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z" />
          <path fill="currentColor" d="M9 14h6v1H9zm0 2h6v1H9z" />
        </svg>
      </span>
      <div class="footer-contact">
        <span class="footer-label">Fax</span>
        <span class="footer-value"><span class="footer-number">914-968-2909</span> or <span class="footer-number">914-968-3689</span></span>
      </div>
    </li>
  </ul>
</footer>

        </form>
      </div>
    </div>

    <script src="app.js"></script>
    <div class="snow"></div>
    <div class="winter-forest"></div>
  </body>
</html>
